# Draft for NousResearch/hermes-agent plugin-catalog/xentropy.yaml (the alternative upstream path;
# see hermes/PR.md). Replace the sha with the full commit of xentropyai/xentropy-plugins that the
# reviewer should read, after the repo is public (D-1). The placeholder is not hex, so upstream's
# loader rejects it if it is ever submitted unchanged.
name: xentropy
title: Xentropy
repo: https://github.com/xentropyai/xentropy-plugins
sha: REPLACE_WITH_40_HEX_COMMIT_SHA
subdir: plugins/xentropy
description: >-
  Build charts, tables and dashboards from your own connected data (PostgreSQL, OpenAPI,
  Google Sheets, Google Drive, Google Analytics) through Xentropy's hosted MCP server
  (Streamable HTTP, OAuth 2.1), with the xentropy-* workflow skills bundled. Portable Agent
  Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: hosted-only connector with
  no local code; every tool call goes to api.xentropy.ai, signed in as the user. Rows read from
  the user's connected sources are pulled into the session context, and so reach the user's
  model provider. Write tools create and change Xentropy artifacts, dashboards and datasets, and
  (only when the user enables them) write to Google Sheets and Drive, share links or publish
  publicly. The tool list comes from Xentropy's server at run time, so the pinned commit does
  not cover it. Hermes stores and refreshes the OAuth tokens. OAuth must be enabled with
  `hermes mcp add xentropy --url https://api.xentropy.ai/mcp --auth oauth`; the bundled
  mcp.json alone yields 401.
maintainer: xentropyai
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://docs.xentropy.ai/agents/clients/hermes
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
